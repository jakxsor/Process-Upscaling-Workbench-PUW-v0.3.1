name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r upscaling_pipeline_tool/requirements.txt

      # Every served script, not just the two largest: the modules extracted out of app.js are where
      # active refactoring happens, so they are the ones most likely to break.
      - name: Check JavaScript syntax
        run: |
          for file in upscaling_pipeline_tool/static/*.js; do
            node --check "$file"
          done

      # Globbed rather than listed, so a new module cannot silently escape the syntax check.
      - name: Check Python syntax
        run: |
          python -m py_compile start.py run_upscaling_tool.py
          python -m py_compile upscaling_pipeline_tool/*.py

      - name: Run workflow regression checks
        run: |
          node scripts/check_complete_separation_flow.js
          node scripts/check_separation_simulator.js
          node scripts/check_property_screening.js
          node scripts/check_flowsheet_view.js
          node scripts/check_project_persistence.js
          node scripts/check_tutorial_flow.js
          python scripts/check_lci_xlsx_export.py
          python scripts/check_flowsheet_pptx_export.py
          python scripts/check_pubchem_lookup.py
          python scripts/check_server_payload.py

      # Behavioural checks: these assert that the answers are physically possible and that the UI is
      # actually wired, rather than that a given string is present in the source. They exist because
      # every serious defect found so far failed silently - a schedule inconsistent with its own task
      # times, a lab-sized reactor reported for an industrial target, a panel rendering into a
      # container that no longer existed, buttons with no handler behind them.
      - name: Check physical plausibility and UI wiring
        run: |
          node scripts/check_physical_plausibility.js
          node scripts/check_ui_wiring.js

      # The one check that looks at the rendered page. The board regression it guards (opening at
      # 35% zoom, clipped, on every screen size) passed every static check above.
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke check
        run: node scripts/check_browser_smoke.js
